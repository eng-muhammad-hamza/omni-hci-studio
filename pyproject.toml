[project]
name = "omni-hci-studio"
version = "1.0.0"
description = "OmniHCI Studio: Unified Multimodal Human-Computer Interaction Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "pillow>=10.0.0",
    "librosa>=0.10.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
    "openai-whisper>=20231117",
    "pyttsx3>=2.90",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
